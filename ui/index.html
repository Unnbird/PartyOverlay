<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyOverlay - FFXIV 跨服隊伍監控</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/partyoverlay.css">
</head>
<body>
  <div id="app" class="overlay-root">

    <div class="title-bar">
      <div class="title-bar-left">
        <span class="status-dot" id="statusIndicator" title="OverlayPlugin 連線狀態"></span>
        <h1 class="title" id="partyTitle">隊伍成員 (Party Members)</h1>
      </div>
      <div class="title-bar-right">
        <span class="badge" id="partyBadge">未組隊</span>
        <button class="icon-btn" id="collapseBtn" title="縮小" aria-label="縮小"></button>
      </div>
    </div>

    <main class="party-grid scroll-thin" id="partyGrid"></main>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon" data-icon="users" data-icon-size="26"></div>
      <div class="empty-text" id="emptyText">等待 OverlayPlugin 連線...</div>
      <div class="empty-sub" id="emptyDiagnostic">等待組隊邀請或搜尋隊伍中...</div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/partyoverlay.js"></script>
</body>
</html>
